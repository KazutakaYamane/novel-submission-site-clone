name: ci

# master への push では deploy.yml が workflow_call で呼ぶので、push は付けない
on:
  pull_request:
    branches: [master]
  workflow_call:

# 各ジョブで permissions を contents: read に絞る。deploy.yml から呼ばれると
# 呼び出し元の id-token: write を引き継ぎ、テストのコードが AWS のロールを引き受けられてしまう
jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: start containers
        id: setup
        run: |
          # bind mount した backend/ に composer の post-autoload-dump が書き込むため、コンテナの www-data をランナーのユーザーに合わせる
          printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
          docker compose up -d app
          docker compose exec -T app composer install --no-interaction --no-progress
          docker compose exec -T app sh -c 'cp .env.example .env && php artisan key:generate --no-interaction'
      # 1 つ落ちても残りのチェックを実行し、違反をまとめて出す
      - name: pest
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: docker compose exec -T app ./vendor/bin/pest
      - name: phpstan
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: docker compose exec -T app ./vendor/bin/phpstan analyse --no-progress
      - name: pint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: docker compose exec -T app ./vendor/bin/pint --test

  frontend:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: start containers
        id: setup
        run: |
          docker compose up -d web
          # web は起動時に npm ci してから next dev を起動するので、Ready が出るまで node_modules が揃わない
          timeout 600 sh -c 'until docker compose logs web | grep -q "Ready in"; do sleep 3; done' \
            || { docker compose logs web; exit 1; }
      - name: lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: docker compose exec -T web npm run lint
      - name: typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: docker compose exec -T web npm run typecheck
      - name: test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: docker compose exec -T web npm run test
      - name: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: docker compose exec -T web npm run build

  api-types:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: start containers
        run: |
          printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
          docker compose up -d app web
          docker compose exec -T app composer install --no-interaction --no-progress
          docker compose exec -T app sh -c 'cp .env.example .env && php artisan key:generate --no-interaction'
          timeout 600 sh -c 'until docker compose logs web | grep -q "Ready in"; do sleep 3; done' \
            || { docker compose logs web; exit 1; }
      - name: check generated files
        run: scripts/generate-api-types.sh --check

  # deploy.yml からも呼ばれるので、マージ後の SHA でも E2E が通ってからイメージを作る
  e2e:
    runs-on: ubuntu-24.04-arm
    # 止まったまま 6 時間の既定まで待つと、deploy.yml の concurrency で後のデプロイも待たされる
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: start containers
        run: |
          printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
          # web の npm ci と next dev の起動を、composer install と並行に進める
          docker compose up -d app web
          docker compose exec -T app composer install --no-interaction --no-progress
          docker compose exec -T app sh -c 'cp .env.example .env && php artisan key:generate --no-interaction'
          # smoke.spec.ts などはシードの作品を前提にする
          docker compose exec -T app php artisan migrate --seed --no-interaction
          # worker は公開・非公開化のときに web のキャッシュを破棄する。vendor が揃ってから起動する
          docker compose up -d nginx worker
          timeout 600 sh -c 'until docker compose logs web | grep -q "Ready in"; do sleep 3; done' \
            || { docker compose logs web; exit 1; }
      - name: e2e
        run: docker compose run --rm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-dev
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  e2e-cache:
    runs-on: ubuntu-24.04-arm
    # 止まったまま 6 時間の既定まで待つと、deploy.yml の concurrency で後のデプロイも待たされる
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # deploy.yml の build-nextjs が書いた本番イメージのレイヤーを読み、builder のキャッシュに載せる。
      # setup-buildx-action が切り替えた builder で compose も組むので、e2e-cache.sh の up --build がそのキャッシュを使う。
      # app も同じ builder で組まないと、up --build が依存の app を新しい builder でキャッシュ無しに組み直す
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          source: .
          files: compose.yaml
          targets: web-prod
          set: web-prod.cache-from=type=gha,scope=nextjs
      - name: start containers
        run: |
          printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
          docker compose up -d app
          docker compose exec -T app composer install --no-interaction --no-progress
          docker compose exec -T app sh -c 'cp .env.example .env && php artisan key:generate --no-interaction'
          # cache.spec.ts はトップの新着に作品が並んでいることを前提にする
          docker compose exec -T app php artisan migrate --seed --no-interaction
      - name: e2e
        run: scripts/e2e-cache.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-cache
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
