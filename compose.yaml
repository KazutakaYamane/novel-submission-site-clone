# ------------------------------------------------------------
# ローカル開発用 Docker Compose
# - 本番(ECS)と同じ Dockerfile / 同じ Nginx 設定を使う
# - 本番との差分: dev ターゲットビルド、Vite/Mailpit/Minio が同居、bind mount
# ------------------------------------------------------------
name: novel-submission-site-clone

services:
  # ---------- Nginx(本番と同じイメージビルド) ----------
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: dev   # 本番ビルドは target: prod(backend/public を焼き込み)
    environment:
      # default.conf.template の upstream 切替(ECS Fargate では 127.0.0.1 を注入)
      PHP_FPM_HOST: app
    volumes:
      # try_files がファイル実在を確認するため public/ だけ共有する(read-only)。
      # PHP 実行自体は php-fpm 側のファイルシステムで行われる。
      - ./backend/public:/var/www/html/public:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_started
    networks: [app]
    restart: unless-stopped

  # ---------- Laravel + php-fpm ----------
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev   # 本番ビルドは CI で target: prod を指定
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www/html:delegated
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
    environment:
      # APP
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8080}
      # DB
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: novel_submission_site
      DB_USERNAME: novel_submission_site
      DB_PASSWORD: ${DB_PASSWORD:-password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      # Mail (Mailpit)
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: noreply@novel-submission-site-clone.local
      # S3 互換(Minio)
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_BUCKET: novel-submission-site-clone
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      # Xdebug
      PHP_IDE_CONFIG: "serverName=novel-submission-site-clone"
      # 公開ページのキャッシュ破棄を頼む先(web の /api/revalidate)。
      # scripts/e2e-cache.sh が worker だけを web-prod に向けて作り直すため、上書きできるようにする
      NEXT_REVALIDATE_URL: ${NEXT_REVALIDATE_URL:-http://web:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-local-revalidate-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [app]
    restart: unless-stopped

  # ---------- キューの worker ----------
  # app と同じイメージ・環境変数で、Redis のキューのジョブを処理する。
  # queue:listen はジョブごとにコードを読み直すので、コードを変えても worker を作り直さずに済む
  worker:
    extends: app
    command: ["php", "artisan", "queue:listen"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ---------- MySQL ----------
  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: novel_submission_site
      MYSQL_USER: novel_submission_site
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      TZ: Asia/Tokyo
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]
    restart: unless-stopped

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks: [app]
    restart: unless-stopped

  # ---------- メール確認 UI(Mailpit) ----------
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"  # Web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    networks: [app]
    restart: unless-stopped

  # ---------- S3 互換ストレージ(Minio) ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"      # API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # 管理 UI
    networks: [app]
    restart: unless-stopped

  # ---------- web (Next.js フロントエンド HMR) ----------
  # frontend/ ディレクトリで Laravel(backend/)とは独立して動かす Next.js。
  # サービス名 web は本番の 2 サービス構成(web=Next.js / api=Laravel)と揃える。
  web:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: dev   # 本番は --platform linux/arm64 --target prod でビルド
    environment:
      # SSR 用の 8080 を呼ぶ(本番は Service Connect の http://api:8080)。
      INTERNAL_API_URL: "http://nginx:8080"
      REDIS_URL: "redis://redis:6379"
      # og:url などの絶対 URL の基点(本番は公開ドメイン)
      SITE_URL: "http://localhost:${NEXT_PORT:-3000}"
      # Laravel の worker から /api/revalidate への呼び出しを確かめる値。app と同じにする
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-local-revalidate-secret}
    volumes:
      - ./frontend:/app:delegated
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - "${NEXT_PORT:-3000}:3000"
    # Next.js のキャッシュと、Redis に繋ぐ結合テストが使う
    depends_on:
      redis:
        condition: service_started
    networks: [app]
    restart: unless-stopped

  # ---------- web-prod (Next.js 本番イメージ) ----------
  # 本番と同じイメージで、キャッシュ越しの公開の反映を E2E で確かめる(scripts/e2e-cache.sh)。
  # dev の web とは別のコンテナなので、web の .next に触れない
  web-prod:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: prod
    profiles: [e2e]
    environment:
      INTERNAL_API_URL: "http://nginx:8080"
      REDIS_URL: "redis://redis:6379"
      SITE_URL: "http://web-prod:3000"
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-local-revalidate-secret}
    healthcheck:
      # localhost は IPv6 に解決され、0.0.0.0 で待つ Next.js に届かない。
      # / は Laravel を呼ぶので、静的なファイルで起動だけを確かめる
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/favicon.ico"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      redis:
        condition: service_started
    networks: [app]

  # ---------- E2E (Playwright) ----------
  # 普段は起動しない。`docker compose run --rm e2e` で dev の web に対して実行する。
  # 本番ビルドに対するキャッシュの E2E は scripts/e2e-cache.sh で実行する。
  # イメージのタグは e2e/package.json の @playwright/test と同じバージョンに揃える
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    profiles: [e2e]
    # ホストのファイルが root 所有にならないよう、bind mount の所有者と揃える
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /e2e
    environment:
      # 非 root 実行時に npm のキャッシュ先が書き込み可能になるようにする
      HOME: /tmp
    volumes:
      - ./e2e:/e2e
    command: ["sh", "-c", "npm ci && npx playwright test --project=dev"]
    depends_on: [web]
    networks: [app]

  # web-prod に対して cache.spec.ts を実行する。scripts/e2e-cache.sh から使う。
  # 本番ビルドの token cookie は secure なので、http で開くとブラウザが保存しない。
  # web-prod のネットワークを共有して http://127.0.0.1:3000 で開き、ブラウザに安全なオリジンとして扱わせる
  e2e-cache:
    extends: e2e
    command: ["sh", "-c", "npm ci && npx playwright test --project=cache"]
    network_mode: service:web-prod
    networks: !reset []
    depends_on: !override [web-prod]

networks:
  app:
    driver: bridge

volumes:
  mysqldata:
  redisdata:
  miniodata:
  vendor:
  storage:
  node_modules:
  next_cache:
