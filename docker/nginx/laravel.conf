# ------------------------------------------------------------
# port 80 / 8080 の server ブロックで共通の設定。default.conf.template から include する。
# php-fpm に渡す送信元 IP は、各 server ブロックで $client_ip に入れておく。
# ------------------------------------------------------------

root /var/www/html/public;
index index.php;

# ALB ヘルスチェック用(アプリの状態と独立させる)
location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}

# 静的ファイルは Nginx で直接配信
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# PHP の実行
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass php_fpm;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    # Laravel の $request->ip() はこの値を返す。Laravel 側の TrustProxies で
    # X-Forwarded-For を信頼すると、ユーザーが偽装した値で上書きされるため信頼させない
    fastcgi_param REMOTE_ADDR $client_ip;

    # 長めのタイムアウトは ALB 側と合わせて 60s
    fastcgi_read_timeout 60s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# php-fpm の ping/status を Nginx 経由で参照可能に(local からのみ)
location ~ ^/(fpm-status|fpm-ping)$ {
    access_log off;
    allow 127.0.0.1;
    deny all;
    fastcgi_pass php_fpm;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
}

# .ht* 系の隠しファイルを返さない
location ~ /\.(?!well-known).* {
    deny all;
}

# クライアント側のボディサイズ上限(php.ini と揃える)
client_max_body_size 16m;

# ログは stdout/stderr へ(コンテナの定石)
access_log /dev/stdout;
error_log /dev/stderr warn;
